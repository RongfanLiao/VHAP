[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["vhap/**/*.py"]

[project]
name = "VHAP"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "accelerate==1.13.0",
    "tyro",
    "diffusers==0.32.2",
    "einops==0.8.2",
    "huggingface-hub==0.36.2",
    "moviepy==1.0.3",
    "omegaconf==2.3.0",
    "PyMCubes==0.1.6",
    "pyyaml",
    "numpy==1.22.3",
    "matplotlib==3.8.0",
    "scipy",
    "pillow",
    "opencv-python",
    "ffmpeg-python",
    "colour-science",
    "safetensors==0.7.0",
    "torch",  # manually install to avoid CUDA version mismatch
    "torchvision",  # manually install to avoid CUDA version mismatch
    "tensorboard",
    "transformers==4.41.2",
    "chumpy",
    "trimesh",
    "nvdiffrast@git+https://github.com/ShenhanQian/nvdiffrast@backface-culling",
    "BackgroundMattingV2@git+https://github.com/ShenhanQian/BackgroundMattingV2",
    "STAR@git+https://github.com/ShenhanQian/STAR/",
    "dlib",  # for STAR
    "pandas",  # for STAR
    "gdown",  # for STAR
    "face-alignment",
    "pytorch3d@git+https://github.com/facebookresearch/pytorch3d.git",
    "dearpygui",
    "joblib"
]
authors = [
  {name = "Shenhan Qian", email = "shenhan.qian@tum.de"},
]

description = "A complete head tracking pipeline from videos to AvatarFacing datasets."
readme = "README.md"
